<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfertronix · Demo de Reapli</title>
  <meta name="description" content="Demo de Reapli, el agente de compras con presupuesto de Transfertronix, sobre Reap Agentic Payments.">
  <meta property="og:title" content="Transfertronix · Demo de Reapli">
  <meta property="og:description" content="Reapli compra por tu equipo sin salirse del presupuesto. Demo en el sandbox de Reap.">
  <meta property="og:image" content="/video/poster.jpg">
  <meta property="og:video" content="/video/transfertronix-demo.mp4">
  <style>
    :root { --bg: #0b1120; --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; min-height: 100dvh; background: radial-gradient(circle at 50% 20%, #1e3a8a55, transparent 60%), var(--bg);
           color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
    video { height: min(86vh, 86dvh); max-width: 100%; aspect-ratio: 9 / 16; border-radius: 22px; background: #000; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); }
    p { font-size: 14px; color: var(--muted); text-align: center; }
    a { color: #93c5fd; text-decoration: none; font-weight: 600; }
    .lang { display: flex; gap: 2px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 3px; }
    .lang button { background: none; border: 0; color: var(--muted); font: 600 13px -apple-system, sans-serif; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
    .lang button.active { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <video controls playsinline autoplay muted preload="auto" poster="/video/poster.jpg">
    <source src="/video/transfertronix-demo.mp4" type="video/mp4">
  </video>
  <p id="caption">⚡ Transfertronix · Reapli — <a href="/">Conoce el proyecto</a> · Activa el sonido para escuchar la música 🔊</p>
  <div class="lang">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <script>
    (function () {
      var TEXT = {
        es: '⚡ Transfertronix · Reapli — <a href="/">Conoce el proyecto</a> · Activa el sonido para escuchar la música 🔊',
        en: '⚡ Transfertronix · Reapli — <a href="/">Learn about the project</a> · Turn on sound to hear the music 🔊'
      };
      var TITLES = {es: 'Transfertronix · Demo de Reapli', en: 'Transfertronix · Reapli demo'};
      function apply(lang) {
        document.getElementById('caption').innerHTML = TEXT[lang];
        var video = document.querySelector('video');
        var src = lang === 'en' ? '/video/transfertronix-demo-en.mp4' : '/video/transfertronix-demo.mp4';
        if (video.getAttribute('data-src') !== src) {
          video.setAttribute('data-src', src);
          video.poster = lang === 'en' ? '/video/poster-en.jpg' : '/video/poster.jpg';
          video.querySelector('source').src = src;
          video.load();
          video.play().catch(function () {});
        }
        document.title = TITLES[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll('.lang button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-lang') === lang);
        });
        try { localStorage.setItem('lang', lang); } catch (e) {}
      }
      var saved = null;
      try { saved = localStorage.getItem('lang'); } catch (e) {}
      document.querySelectorAll('.lang button').forEach(function (b) {
        b.addEventListener('click', function () { apply(b.getAttribute('data-lang')); });
      });
      apply(saved || ((navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en'));
    })();
  </script>
</body>
</html>
